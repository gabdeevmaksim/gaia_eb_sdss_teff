# Validation Configuration for Gaia Colors → [Fe/H] Model

model:
  # Model pattern to validate (uses most recent)
  model_pattern: "rf_gaia_colors_feh_*"

plots:
  # Which validation plots to generate
  test_scatter: true          # Scatter plot: predicted vs actual
  residuals: true              # Residual plot: errors vs predicted
  performance_by_temp: true    # Performance metrics by metallicity bins
  temp_distributions: true     # Distribution comparison (predicted vs actual)
  feature_importance: true     # Feature importance bar chart

output:
  # Subdirectory for figures (under reports/figures/)
  figures_subdir: "gaia_colors_feh_validation"

  # Report file (text summary of metrics)
  report_file: "reports/validation_report_rf_gaia_colors_feh.txt"

# Target information for [Fe/H] metallicity
target_info:
  name: "Metallicity"      # Full name for plot labels
  unit: "dex"              # Unit for axis labels
  short: "[Fe/H]"          # Short name for filenames

# Metallicity ranges for performance analysis
temp_ranges:
  - [-2.5, -1.0]    # Metal-poor
  - [-1.0, -0.5]    # Moderately metal-poor
  - [-0.5, 0.0]     # Sub-solar
  - [0.0, 0.5]      # Super-solar
  - [0.5, 1.0]      # Very metal-rich
