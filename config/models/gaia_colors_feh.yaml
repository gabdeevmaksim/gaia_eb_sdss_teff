model:
  name: "Gaia Colors → [Fe/H]"
  id_prefix: "rf_gaia_colors_feh"
  description: "Metallicity prediction from Gaia photometry only"

data:
  source_file: "eb_unified_photometry.parquet"
  source_format: "parquet"
  source_location: "processed"
  target: "mh_gaia"
  features:
    - "g"
    - "bp"
    - "rp"
    - "bp_rp"
    - "g_rp"
    - "g_bp"
  id_column: "source_id"

preprocessing:
  missing_value: -999.0
  filters:
    mh_gaia: [-2.5, 1.0]  # Typical metallicity range

ml:
  algorithm: "RandomForestRegressor"
  test_size: 0.2
  random_state: 42
  hyperparameters:
    n_estimators: 300
    max_depth: 20
    min_samples_split: 5
    min_samples_leaf: 4
    max_features: "log2"
    random_state: 42
    n_jobs: -1
    verbose: 0

output:
  save_model: true
  save_predictions: true
  save_test_predictions: true
  models_dir: "models"
  predictions_dir: "data/predictions"
