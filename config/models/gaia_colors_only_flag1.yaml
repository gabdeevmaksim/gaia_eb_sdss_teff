model:
  name: "Gaia Colors Only → Corrected Teff (Flag 1 High Quality)"
  id_prefix: "rf_gaia_colors_flag1"
  description: "Temperature prediction from Gaia photometry only, trained on high-quality flag 1 sources with corrected Teff"

data:
  source_file: "eb_unified_photometry_with_flags.parquet"
  source_format: "parquet"
  source_location: "processed"
  target: "teff_gaia_corrected"  # Will be created by teff_correction step
  features:
    - "g"
    - "bp"
    - "rp"
    - "bp_rp"
    - "g_rp"
    - "g_bp"
  id_column: "source_id"

target_transform: "none"  # NO log transformation

preprocessing:
  missing_value: -999.0
  filters:
    teff_gaia: [2500, 50000]  # Full temperature range
    teff_gspphot_flag: [1, 1]  # ONLY high-quality flag 1 sources

teff_correction:
  enabled: true
  target_column: "teff_gaia"
  threshold: 10000
  coefficients_file: "teff_correction_coeffs_deg2.pkl"

feature_engineering:
  enabled: false  # NO feature engineering - just raw Gaia photometry

ml:
  algorithm: "RandomForestRegressor"
  test_size: 0.2
  random_state: 42
  hyperparameters:
    n_estimators: 300
    max_depth: 20
    min_samples_split: 5
    min_samples_leaf: 2
    max_features: "sqrt"
    random_state: 42
    n_jobs: -1
    verbose: 1

uncertainty:
  enabled: true
  method: "full_tree"  # Full tree method for accurate uncertainties

output:
  save_model: true
  save_predictions: true
  save_test_predictions: true
  models_dir: "models"
  predictions_dir: "data/predictions"
