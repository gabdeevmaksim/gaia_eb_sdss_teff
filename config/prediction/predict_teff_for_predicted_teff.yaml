# Prediction Configuration: Teff for objects with predicted Teff
# Predicts Teff with uncertainties using Gaia photometry only

model:
  # Use best Gaia All Colors → Teff model (log-transformed)
  model_file: "rf_gaia_all_colors_teff_log_20251112_162857.pkl"

data:
  # Source dataset (unified photometry with best parameters)
  source_file: "eb_unified_photometry_with_best_params.parquet"
  id_column: "source_id"

  # Filter for objects with PREDICTED Teff (teff_source == 1)
  filters:
    teff_source: 1  # 0 = original Gaia, 1 = predicted

preprocessing:
  filter_missing: true
  missing_value: -999.0

  # Ensure required features are valid
  required_features:
    - "g"
    - "bp"
    - "rp"
    - "bp_rp"

feature_engineering:
  # No feature engineering needed (model uses raw photometry)
  enabled: false

# Uncertainty estimation configuration
uncertainty:
  fast: false  # Use full tree method (all 300 trees) for accurate uncertainties
  # n_sample_trees: 20  # Not used when fast=false

output:
  output_file: "teff_predictions_for_predicted_teff.parquet"

  # Include key metadata columns
  include_columns:
    - "source_id"
    - "ra"
    - "dec"
    - "g"
    - "bp"
    - "rp"
    - "bp_rp"
    - "teff_source"
    - "logg_source"
    - "teff_unified"
    - "logg_unified"

  save_summary: true
